<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | DRIVE-NATION GLOBAL</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="admin-header">
        <div class="logo">
            DRIVE-NATION <span>GLOBAL ADMIN</span>
        </div>
        <div class="nav-tools">
            <a href="/" target="_blank" class="btn-secondary small">View Public Site</a>
            <a href="/logout" class="btn-danger small">Logout</a>
        </div>
    </header>

    <main class="admin-container">
        <div class="admin-top-bar">
            <h2>Inventory Management</h2>
            <button class="btn-primary" onclick="openModal()">+ Add New Vehicle</button>
        </div>

        <div class="table-container">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Title</th>
                        <th>Type</th>
                        <th>Price / Rate</th>
                        <th>Stock</th>
                        <th>Details</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="admin-vehicle-list">
                    <!-- Dynamically populated -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- ADD VEHICLE MODAL -->
    <div class="modal-overlay" id="vehicle-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Add Vehicle Listing</h3>
                <button class="close-modal-btn" onclick="closeModal()">&times;</button>
            </div>
            <form id="add-vehicle-form" onsubmit="handleFormSubmit(event)" enctype="multipart/form-data">
                
                <div class="form-group">
                    <label for="input-type">Listing Purpose *</label>
                    <select id="input-type" onchange="toggleFormFields()" required>
                        <option value="sale">Buying (For Sale)</option>
                        <option value="rent">Renting (For Rent)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="input-title">Vehicle Name / Title *</label>
                    <input type="text" id="input-title" placeholder="e.g. 2024 Ford F-150" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="input-images">Vehicle Photos (Select single or multiple) *</label>
                        <input type="file" id="input-images" accept="image/*" multiple>
                        <!-- Image Preview Strip -->
                        <div id="image-preview-container" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px;"></div>
                    </div>
                    <div class="form-group">
                        <label for="input-stock">Stock Quantity *</label>
                        <input type="number" id="input-stock" placeholder="1" min="0" value="1" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="input-fuel">Fuel Type</label>
                        <select id="input-fuel">
                            <option value="Gasoline">Gasoline</option>
                            <option value="Hybrid">Hybrid</option>
                            <option value="Electric">Electric</option>
                            <option value="Diesel">Diesel</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="input-drivetrain">Drivetrain</label>
                        <select id="input-drivetrain">
                            <option value="AWD">AWD</option>
                            <option value="4WD">4WD</option>
                            <option value="FWD">FWD</option>
                            <option value="RWD">RWD</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="input-specs">Specifications & Features *</label>
                    <input type="text" id="input-specs" placeholder="e.g. 4WD • Leather Seats • Navigation" required>
                </div>

                <!-- FOR SALE FIELDS -->
                <div id="fields-sale">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="input-make">Make</label>
                            <input type="text" id="input-make" placeholder="Ford">
                        </div>
                        <div class="form-group">
                            <label for="input-year">Year</label>
                            <input type="number" id="input-year" placeholder="2024">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="input-price">Sale Price ($)</label>
                            <input type="number" id="input-price" placeholder="45000">
                        </div>
                        <div class="form-group">
                            <label for="input-mileage">Mileage (mi)</label>
                            <input type="number" id="input-mileage" placeholder="15000">
                        </div>
                    </div>
                </div>

                <!-- FOR RENT FIELDS -->
                <div id="fields-rent" class="hidden">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="input-category">Category</label>
                            <select id="input-category">
                                <option value="SUV">SUV</option>
                                <option value="Sedan">Sedan</option>
                                <option value="Luxury">Luxury</option>
                                <option value="Truck">Truck</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="input-daily">Daily Rate ($/day)</label>
                            <input type="number" id="input-daily" placeholder="120">
                        </div>
                    </div>
                </div>

                <button type="submit" id="submit-btn" class="submit-btn">Publish to Website</button>
            </form>
        </div>
    </div>

    <script>
        let selectedFiles = [];

        document.addEventListener("DOMContentLoaded", () => {
            fetchAdminVehicles();

            // Accumulate selected files without replacing existing ones
            const imageInput = document.getElementById("input-images");
            if (imageInput) {
                imageInput.addEventListener("change", (e) => {
                    const files = Array.from(e.target.files);
                    selectedFiles = selectedFiles.concat(files);
                    renderPreviews();
                    e.target.value = ""; // Clear picker state to allow picking more photos
                });
            }
        });

        function renderPreviews() {
            const container = document.getElementById("image-preview-container");
            if (!container) return;
            container.innerHTML = "";

            selectedFiles.forEach((file, index) => {
                const wrapper = document.createElement("div");
                wrapper.style.cssText = "position: relative; width: 65px; height: 65px;";

                const img = document.createElement("img");
                img.src = URL.createObjectURL(file);
                img.style.cssText = "width: 100%; height: 100%; object-fit: cover; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2);";

                const removeBtn = document.createElement("button");
                removeBtn.type = "button";
                removeBtn.innerHTML = "&times;";
                removeBtn.style.cssText = "position: absolute; top: -5px; right: -5px; background: #e63946; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;";
                removeBtn.onclick = () => {
                    selectedFiles.splice(index, 1);
                    renderPreviews();
                };

                wrapper.appendChild(img);
                wrapper.appendChild(removeBtn);
                container.appendChild(wrapper);
            });
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, match => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[match]));
        }

        async function fetchAdminVehicles() {
            try {
                const res = await fetch(`/api/cars?t=${Date.now()}`);
                const cars = await res.json();
                const tbody = document.getElementById("admin-vehicle-list");
                tbody.innerHTML = "";

                cars.forEach(car => {
                    const isSale = car.type === 'sale';
                    const priceText = isSale 
                        ? `$${car.price ? Number(car.price).toLocaleString() : '0'}` 
                        : `$${car.dailyPrice ? escapeHTML(car.dailyPrice) : '0'}/day`;
                    
                    const typeBadge = isSale 
                        ? '<span class="badge sale">For Sale</span>' 
                        : '<span class="badge rent">For Rent</span>';
                    
                    const details = isSale 
                        ? `${car.year || ''} • ${car.mileage ? Number(car.mileage).toLocaleString() + ' mi' : '0 mi'}` 
                        : `${escapeHTML(car.category || 'Rental')}`;
                    
                    const mainImage = Array.isArray(car.images) && car.images.length > 0 ? car.images[0] : (car.image || '/static/placeholder.jpg');
                    const stockDisplay = car.stock > 0 
                        ? `<strong>${car.stock}</strong>` 
                        : `<span style="color:var(--danger,#e63946);">Out of stock</span>`;

                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${escapeHTML(mainImage)}" class="table-img" alt="${escapeHTML(car.title)}" style="width: 60px; height: 45px; object-fit: cover; border-radius: 4px;"></td>
                            <td><strong>${escapeHTML(car.title)}</strong></td>
                            <td>${typeBadge}</td>
                            <td>${priceText}</td>
                            <td>${stockDisplay}</td>
                            <td>${details}</td>
                            <td>
                                <button class="btn-delete" onclick="deleteVehicle(${car.id})">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Failed to fetch vehicles:", err);
            }
        }

        function openModal() { document.getElementById("vehicle-modal").classList.add("active"); }
        function closeModal() { 
            document.getElementById("vehicle-modal").classList.remove("active"); 
            document.getElementById("add-vehicle-form").reset();
            selectedFiles = [];
            renderPreviews();
            toggleFormFields();
        }

        function toggleFormFields() {
            const type = document.getElementById("input-type").value;
            document.getElementById("fields-sale").classList.toggle("hidden", type !== 'sale');
            document.getElementById("fields-rent").classList.toggle("hidden", type !== 'rent');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();

            if (selectedFiles.length === 0) {
                alert("Please select at least one vehicle photo.");
                return;
            }

            const submitBtn = document.getElementById("submit-btn");
            const originalText = submitBtn.innerText;
            
            const type = document.getElementById("input-type").value;
            const formData = new FormData();

            formData.append("type", type);
            formData.append("title", document.getElementById("input-title").value.trim());
            formData.append("specs", document.getElementById("input-specs").value.trim());
            formData.append("stock", document.getElementById("input-stock").value || '1');
            formData.append("fuelType", document.getElementById("input-fuel").value);
            formData.append("drivetrain", document.getElementById("input-drivetrain").value);

            // Append all accumulated files
            selectedFiles.forEach(file => {
                formData.append("images", file);
            });

            if (type === 'sale') {
                formData.append("make", document.getElementById("input-make").value.trim() || 'Other');
                formData.append("year", document.getElementById("input-year").value || '2024');
                formData.append("price", document.getElementById("input-price").value || '0');
                formData.append("mileage", document.getElementById("input-mileage").value || '0');
            } else {
                formData.append("category", document.getElementById("input-category").value);
                formData.append("dailyPrice", document.getElementById("input-daily").value || '0');
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = "Uploading to Cloudinary...";

                const res = await fetch('/api/cars', {
                    method: 'POST',
                    body: formData
                });

                if (res.ok) {
                    closeModal();
                    fetchAdminVehicles();
                } else {
                    const data = await res.json();
                    alert(data.message || "Failed to save vehicle.");
                }
            } catch (err) {
                console.error("Error saving vehicle:", err);
                alert("Failed to save vehicle. Check server connection.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = originalText;
            }
        }

        async function deleteVehicle(id) {
            if (!confirm("Are you sure you want to delete this listing?")) return;
            
            try {
                const res = await fetch(`/api/cars/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    fetchAdminVehicles();
                } else {
                    alert("Failed to delete vehicle.");
                }
            } catch (err) {
                console.error("Error deleting vehicle:", err);
                alert("Failed to delete vehicle.");
            }
        }
    </script>
</body>
</html>
